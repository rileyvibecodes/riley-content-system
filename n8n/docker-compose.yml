version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: riley-content-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Basic Configuration
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      
      # Webhook Configuration
      - WEBHOOK_URL=http://localhost:5678/
      
      # Timezone
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      
      # Execution Settings
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      
      # Security (change these in production)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=riley
      - N8N_BASIC_AUTH_PASSWORD=content2024
      
      # Encryption Key (generate a new one for production)
      - N8N_ENCRYPTION_KEY=riley-content-system-encryption-key-change-me
      
      # External Hooks for Claude API
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      
    volumes:
      # Persist n8n data
      - n8n_data:/home/node/.n8n
      
      # Mount local directories for file operations
      - ../knowledge-base:/files/knowledge-base:ro
      - ../prompts:/files/prompts:ro
      - ../config:/files/config:ro
      - ../outputs:/files/outputs:rw
      
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  n8n_data:
    driver: local

